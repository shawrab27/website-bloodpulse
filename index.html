<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BloodPulse — National Blood Donation Platform</title>
  </head>
  <body>
    <!-- Persistent Floating Action Button (Top-Right, high z-index, outside timeline) -->
    <a id="floating-webapp-btn" href="#webapp" class="floating-cta" target="_blank" rel="noopener noreferrer">
      Open Web App
    </a>

    <!-- Scroll track defines the 1200vh total scroll distance -->
    <div id="scroll-track" aria-hidden="true"></div>

    <!-- Pinned full-viewport stage -->
    <div id="stage-viewport">
      <!-- Fixed 1920x1080 design canvas (letterboxed & scaled via CSS) -->
      <div id="canvas-stage">
        <!-- Master SVG Stage Layer -->
        <svg
          id="stage-svg"
          viewBox="0 0 1920 1080"
          preserveAspectRatio="xMidYMid meet"
          xmlns="http://www.w3.org/2000/svg"
        >
          <!-- Dynamic Background Tone (transitions soft grey-pink in Scene 2) -->
          <rect id="stage-bg-rect" width="1920" height="1080" fill="#FFF8F7" />

          <!-- Thin Street Ground Line (y=900) -->
          <line id="ground-line" x1="0" y1="900" x2="1920" y2="900" stroke="#B5B0AE" stroke-width="2" opacity="0" />

          <!-- Scene 2 Impact Flash Aura -->
          <circle id="impact-flash" cx="800" cy="760" r="80" fill="#C30121" opacity="0" style="transform-origin: 800px 760px;" />

          <!-- Ambulance (Facing Right, starts off-screen at x=-600) -->
          <g id="ambulance" class="ambulance-container" style="transform: translate(-600px, 726px);">
            <!-- Siren Light on Roof (Group for pulsing opacity) -->
            <g id="siren" class="siren">
              <rect x="300" y="38" width="22" height="6" rx="2" fill="#3D141B" />
              <path d="M 302,38 C 302,28 320,28 320,38 Z" fill="#C30121" />
              <circle id="siren-glow" cx="311" cy="32" r="18" fill="#C30121" opacity="0.3" />
              <circle id="siren-ring" cx="311" cy="32" r="32" fill="#C30121" opacity="0.1" />
            </g>

            <!-- Main Body Chassis (Maroon #4A1A22) -->
            <path d="
              M 50,60
              C 50,50 60,44 72,44
              L 330,44
              C 342,44 350,50 358,62
              L 384,104
              C 388,110 395,112 404,112
              L 416,112
              C 422,112 426,117 426,124
              L 426,166
              C 426,170 422,174 416,174
              L 380,174
              C 380,146 340,146 340,174
              L 165,174
              C 165,146 125,146 125,174
              L 58,174
              C 52,174 48,170 48,164
              L 48,64
              C 48,56 50,60 50,60 Z
            " fill="#4A1A22" />

            <!-- Red Emergency Stripe (#C30121) -->
            <path d="M 48,118 L 390,118 L 386,134 L 48,134 Z" fill="#C30121" />

            <!-- Windows (White #FFF8F7) -->
            <path d="M 334,54 L 352,54 C 358,54 364,58 370,68 L 384,98 C 386,102 384,106 380,106 L 334,106 C 330,106 328,102 328,98 L 328,60 C 328,56 330,54 334,54 Z" fill="#FFF8F7" />
            <rect x="180" y="58" width="90" height="42" rx="4" fill="#FFF8F7" />
            <rect x="75" y="58" width="55" height="42" rx="4" fill="#FFF8F7" />

            <!-- Medical Star of Life (White) on Side Body -->
            <g transform="translate(142, 126) scale(0.75)">
              <rect x="-4" y="-22" width="8" height="44" rx="2" fill="#FFF8F7" />
              <rect x="-4" y="-22" width="8" height="44" rx="2" transform="rotate(60)" fill="#FFF8F7" />
              <rect x="-4" y="-22" width="8" height="44" rx="2" transform="rotate(120)" fill="#FFF8F7" />
              <circle cx="0" cy="0" r="3" fill="#C30121" />
            </g>

            <!-- Headlight & Front Beam -->
            <path d="M 424,124 L 428,124 C 430,124 432,126 432,130 L 432,142 C 432,146 430,148 428,148 L 424,148 Z" fill="#FFF8F7" opacity="0.9" />
            <polygon points="432,124 500,105 500,165 432,148" fill="#FFF8F7" opacity="0.08" />
            <rect x="46" y="122" width="4" height="22" rx="1" fill="#C30121" />

            <!-- Bumpers -->
            <rect x="418" y="160" width="12" height="14" rx="3" fill="#2E0E14" />
            <rect x="42" y="160" width="8" height="14" rx="2" fill="#2E0E14" />

            <!-- Wheels (cy=174; at y=726, touches ground line y=900) -->
            <g class="wheel front-wheel">
              <circle cx="360" cy="174" r="26" fill="#260C11" />
              <circle cx="360" cy="174" r="16" fill="#B5B0AE" />
              <circle cx="360" cy="174" r="7" fill="#4A1A22" />
              <circle cx="360" cy="174" r="3" fill="#FFF8F7" />
            </g>
            <g class="wheel rear-wheel">
              <circle cx="145" cy="174" r="26" fill="#260C11" />
              <circle cx="145" cy="174" r="16" fill="#B5B0AE" />
              <circle cx="145" cy="174" r="7" fill="#4A1A22" />
              <circle cx="145" cy="174" r="3" fill="#FFF8F7" />
            </g>
          </g>

          <!-- Butterfly 1 (Victim: rests injured in bottom-left at 360, 885) -->
          <g id="butterfly-1" class="butterfly-container">
            <!-- Inner float group for idle hovering drift -->
            <g class="butterfly-float">
              <!-- Left Wing -->
              <g class="wing wing-left" style="transform-origin: 0px 0px;">
                <path d="M 0,-14 C -22,-58 -70,-68 -84,-48 C -96,-30 -82,2 -42,8 C -18,10 -2,0 0,-4 Z" fill="#C30121" />
                <path d="M 0,2 C -24,10 -54,8 -56,32 C -58,52 -28,62 -14,48 C -4,38 0,18 0,14 Z" fill="#A8001A" />
                <path d="M 0,-10 C -25,-35 -55,-40 -70,-32" stroke="#4A1A22" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4" />
                <path d="M -30,-22 C -55,-18 -72,-10 -76,-5" stroke="#4A1A22" stroke-width="1" stroke-linecap="round" stroke-opacity="0.35" />
                <path d="M -22,-8 C -42,5 -55,18 -50,30" stroke="#4A1A22" stroke-width="1" stroke-linecap="round" stroke-opacity="0.35" />
                <circle cx="-62" cy="-40" r="3" fill="#FFF8F7" opacity="0.3" />
                <circle cx="-74" cy="-25" r="2.5" fill="#FFF8F7" opacity="0.25" />
                <circle cx="-46" cy="40" r="2" fill="#FFF8F7" opacity="0.25" />
              </g>

              <!-- Right Wing -->
              <g class="wing wing-right" style="transform-origin: 0px 0px;">
                <path d="M 0,-14 C 22,-58 70,-68 84,-48 C 96,-30 82,2 42,8 C 18,10 2,0 0,-4 Z" fill="#C30121" />
                <path d="M 0,2 C 24,10 54,8 56,32 C 58,52 28,62 14,48 C 4,38 0,18 0,14 Z" fill="#A8001A" />
                <path d="M 0,-10 C 25,-35 55,-40 70,-32" stroke="#4A1A22" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4" />
                <path d="M 30,-22 C 55,-18 72,-10 76,-5" stroke="#4A1A22" stroke-width="1" stroke-linecap="round" stroke-opacity="0.35" />
                <path d="M 22,-8 C 42,5 55,18 50,30" stroke="#4A1A22" stroke-width="1" stroke-linecap="round" stroke-opacity="0.35" />
                <circle cx="62" cy="-40" r="3" fill="#FFF8F7" opacity="0.3" />
                <circle cx="74" cy="-25" r="2.5" fill="#FFF8F7" opacity="0.25" />
                <circle cx="46" cy="40" r="2" fill="#FFF8F7" opacity="0.25" />
              </g>

              <!-- Butterfly Body, Head & Antennae -->
              <g class="butterfly-body">
                <path d="M -3,-2 C -3,22 -1.5,34 0,38 C 1.5,34 3,22 3,-2 Z" fill="#4A1A22" />
                <ellipse cx="0" cy="-10" rx="4.5" ry="11" fill="#3D141B" />
                <circle cx="0" cy="-23" r="4.5" fill="#4A1A22" />
                <circle cx="-2.5" cy="-24.5" r="1.2" fill="#C30121" />
                <circle cx="2.5" cy="-24.5" r="1.2" fill="#C30121" />
                <path d="M -1.8,-26 C -5,-36 -14,-43 -19,-41" stroke="#4A1A22" stroke-width="1.4" stroke-linecap="round" fill="none" />
                <circle cx="-19" cy="-41" r="1.2" fill="#C30121" />
                <path d="M 1.8,-26 C 5,-36 14,-43 19,-41" stroke="#4A1A22" stroke-width="1.4" stroke-linecap="round" fill="none" />
                <circle cx="19" cy="-41" r="1.2" fill="#C30121" />
              </g>
            </g>
          </g>

          <!-- Scene 5: Smartphone Frame & Screen (Center-right, rises from y=1200) -->
          <g id="phone-container" class="phone-container" style="transform: translate(948px, 1200px);">
            <defs>
              <!-- Screen Clip Path matching the inner phone screen with rounded corners -->
              <clipPath id="phone-screen-clip">
                <rect x="14" y="14" width="376" height="832" rx="32" />
              </clipPath>
            </defs>

            <!-- Outer Phone Body (Dark Maroon #2A0E13) -->
            <rect x="2" y="2" width="400" height="856" rx="44" fill="#2A0E13" stroke="#4A1A22" stroke-width="3" />
            <rect x="8" y="8" width="388" height="844" rx="38" fill="#1A070B" />

            <!-- Screen Area with Real App Screenshot WebP clipped -->
            <g clip-path="url(#phone-screen-clip)">
              <!-- Background fallback color while image loads -->
              <rect x="14" y="14" width="376" height="832" fill="#FFF8F7" />
              <image
                id="phone-screen-image"
                x="14"
                y="14"
                width="376"
                height="832"
                preserveAspectRatio="xMidYMid slice"
                href=""
              />
            </g>

            <!-- Notch / Dynamic Island -->
            <rect x="157" y="24" width="90" height="24" rx="12" fill="#1A070B" />
            <circle cx="225" cy="36" r="5" fill="#2A0E13" />
            <circle cx="225" cy="36" r="2.5" fill="#3D141B" />

            <!-- Side Buttons -->
            <rect x="401" y="220" width="3" height="70" rx="1.5" fill="#4A1A22" />
            <rect x="0" y="180" width="3" height="50" rx="1.5" fill="#4A1A22" />
            <rect x="0" y="245" width="3" height="50" rx="1.5" fill="#4A1A22" />
          </g>

          <!-- Butterfly 2 (Witness: arrives in Scene 4, hovers in front of phone in Scene 5) -->
          <g id="butterfly-2" class="butterfly-container" style="opacity: 0;">
            <!-- Inner float group for idle hovering drift -->
            <g class="butterfly-float">
              <!-- Left Wing -->
              <g class="wing wing-left" style="transform-origin: 0px 0px;">
                <path d="M 0,-14 C -22,-58 -70,-68 -84,-48 C -96,-30 -82,2 -42,8 C -18,10 -2,0 0,-4 Z" fill="#C30121" />
                <path d="M 0,2 C -24,10 -54,8 -56,32 C -58,52 -28,62 -14,48 C -4,38 0,18 0,14 Z" fill="#A8001A" />
                <path d="M 0,-10 C -25,-35 -55,-40 -70,-32" stroke="#4A1A22" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4" />
                <path d="M -30,-22 C -55,-18 -72,-10 -76,-5" stroke="#4A1A22" stroke-width="1" stroke-linecap="round" stroke-opacity="0.35" />
                <path d="M -22,-8 C -42,5 -55,18 -50,30" stroke="#4A1A22" stroke-width="1" stroke-linecap="round" stroke-opacity="0.35" />
                <circle cx="-62" cy="-40" r="3" fill="#FFF8F7" opacity="0.3" />
                <circle cx="-74" cy="-25" r="2.5" fill="#FFF8F7" opacity="0.25" />
                <circle cx="-46" cy="40" r="2" fill="#FFF8F7" opacity="0.25" />
              </g>

              <!-- Right Wing -->
              <g class="wing wing-right" style="transform-origin: 0px 0px;">
                <path d="M 0,-14 C 22,-58 70,-68 84,-48 C 96,-30 82,2 42,8 C 18,10 2,0 0,-4 Z" fill="#C30121" />
                <path d="M 0,2 C 24,10 54,8 56,32 C 58,52 28,62 14,48 C 4,38 0,18 0,14 Z" fill="#A8001A" />
                <path d="M 0,-10 C 25,-35 55,-40 70,-32" stroke="#4A1A22" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4" />
                <path d="M 30,-22 C 55,-18 72,-10 76,-5" stroke="#4A1A22" stroke-width="1" stroke-linecap="round" stroke-opacity="0.35" />
                <path d="M 22,-8 C 42,5 55,18 50,30" stroke="#4A1A22" stroke-width="1" stroke-linecap="round" stroke-opacity="0.35" />
                <circle cx="62" cy="-40" r="3" fill="#FFF8F7" opacity="0.3" />
                <circle cx="74" cy="-25" r="2.5" fill="#FFF8F7" opacity="0.25" />
                <circle cx="46" cy="40" r="2" fill="#FFF8F7" opacity="0.25" />
              </g>

              <!-- Butterfly Body, Head & Antennae -->
              <g class="butterfly-body">
                <path d="M -3,-2 C -3,22 -1.5,34 0,38 C 1.5,34 3,22 3,-2 Z" fill="#4A1A22" />
                <ellipse cx="0" cy="-10" rx="4.5" ry="11" fill="#3D141B" />
                <circle cx="0" cy="-23" r="4.5" fill="#4A1A22" />
                <circle cx="-2.5" cy="-24.5" r="1.2" fill="#C30121" />
                <circle cx="2.5" cy="-24.5" r="1.2" fill="#C30121" />
                <path d="M -1.8,-26 C -5,-36 -14,-43 -19,-41" stroke="#4A1A22" stroke-width="1.4" stroke-linecap="round" fill="none" />
                <circle cx="-19" cy="-41" r="1.2" fill="#C30121" />
                <path d="M 1.8,-26 C 5,-36 14,-43 19,-41" stroke="#4A1A22" stroke-width="1.4" stroke-linecap="round" fill="none" />
                <circle cx="19" cy="-41" r="1.2" fill="#C30121" />
              </g>
            </g>
          </g>
        </svg>

        <!-- Scene 1 Hero Overlay (HTML layer scaled inside canvas-stage) -->
        <div id="scene-01-hero" class="scene-01-hero">
          <div class="hero-brand">
            <h1 class="hero-title">BloodPulse</h1>
          </div>
          <div class="hero-buttons">
            <a href="#webapp" class="hero-btn hero-btn-primary" target="_blank" rel="noopener noreferrer">Open Web App</a>
            <a href="#playstore" class="hero-btn hero-btn-secondary" target="_blank" rel="noopener noreferrer">Google Play</a>
            <a href="#appstore" class="hero-btn hero-btn-secondary" target="_blank" rel="noopener noreferrer">App Store</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Responsive Fallback for Tablet / Mobile -->
    <div id="device-fallback" role="alert" aria-live="polite">
      <h2>BloodPulse</h2>
      <p class="fallback-text">Mobile experience is coming soon. Please view on a desktop screen (1024px+).</p>
    </div>

    <!-- Debug HUD (toggle with key 'D', hidden by default) -->
    <aside id="debug-hud" class="hud-hidden" aria-label="Debug HUD">
      <div class="hud-title">
        <span>Debug HUD</span>
        <span>[D]</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Scroll:</span>
        <span id="hud-progress" class="hud-val">0.0%</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Label:</span>
        <span id="hud-label" class="hud-val">s1</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">FPS:</span>
        <span id="hud-fps" class="hud-val">60</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Velocity:</span>
        <span id="hud-velocity" class="hud-val">0 px/s</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Wing 1:</span>
        <span id="hud-wings" class="hud-val">0.30x</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Wing 2:</span>
        <span id="hud-wings-2" class="hud-val">0.30x</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Autoplay:</span>
        <span id="hud-autoplay" class="hud-val" style="color: #4ADE80;">OK</span>
      </div>
      <div class="hud-hint">Press 'D' to toggle</div>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
